# SDD Configuration — artepaxf
# Auto-generated by sdd-init. Update as needed.

project: artepaxf
strict_tdd: false
mode: hybrid

context: >
  Vanilla HTML/CSS/JS frontend administrativo para Artepax Fiesta.
  Sin bundler, sin framework, sin test suite.
  Backend: Spring Boot + PostgreSQL (repositorio separado).
  Entry points: index.html (dashboard), login.html (Google OAuth), modules/*/ per feature.
  
  Módulos implementados: Clientes, Eventos, Decoraciones, Inventario,
  Cronograma, Gastos, Pagos, Catálogos.
  Módulos pendientes: Documentos, Configuración, Auditoría, Notificaciones.
  
  Pagos establece el patrón "cobranza queue" con tabs (por evento / global / métodos)
  que servirá de referencia para control-egresos-cola.

testing:
  runner: null
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality_tools:
    linter: false
    type_checker: false
    formatter: false

phases:
  explore: true
  propose: true
  spec: true
  design: true
  tasks: true
  apply: true
  verify:
    enabled: false
    note: "No test suite — verification via code inspection only"
  archive: true

conventions:
  js: camelCase
  html_ids: kebab-case
  css_classes: kebab-case
  api_layer: js/shared/api.js
  script_load_order:
    - js/core/config.js
    - js/core/auth.js
    - js/core/http.js
    - js/shared/api.js
    - js/shared/modulos.js
    - js/shared/formatters.js
    - js/shared/alerts.js
    - modules/X/X.js
  module_pattern: "{module}.html + js/{module}.{layer}.js + {module}.css + css/*.css"
  state_namespace: "window.{Module}State"
  api_namespace: "window.{Module}API"
  render_namespace: "window.{Module}Render"
  actions_namespace: "window.{Module}Actions"
  helpers_namespace: "window.{Module}Helpers"
